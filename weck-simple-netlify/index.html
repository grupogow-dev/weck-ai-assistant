<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weck AI Assistant</title>
<style>
  :root {
    --blue: #0057A8;
    --blue-dark: #003D78;
    --gray: #F4F5F7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--gray);
    color: #1a1a2e;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid #e2e5e9;
  }
  .logo {
    width: 36px; height: 36px;
    background: var(--blue);
    border-radius: 10px;
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  header h1 { font-size: 15px; margin: 0; }
  header p { font-size: 12px; color: #6b7280; margin: 0; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
  }
  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    background: var(--blue);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    background: white;
    border: 1px solid #e2e5e9;
    border-bottom-left-radius: 4px;
  }
  .msg.bot.loading { color: #9ca3af; font-style: italic; }

  .suggestions {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .suggestions button {
    background: white;
    border: 1px solid #e2e5e9;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
    color: #374151;
  }
  .suggestions button:hover { border-color: var(--blue); color: var(--blue); }

  form {
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    display: flex;
    gap: 8px;
    padding: 16px 20px 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid #d1d5db;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--blue); }
  button.send {
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
  }
  button.send:hover { background: var(--blue-dark); }
  button.send:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="logo">W</div>
  <div>
    <h1>Weck AI Assistant</h1>
    <p>Antworten direkt aus den Infos von Weck Dental Technik</p>
  </div>
</header>

<div id="chat"></div>

<div class="suggestions" id="suggestions">
  <button>Wo ist Weck Dental und wie sind die Öffnungszeiten?</button>
  <button>Was ist eine Zirkonkrone?</button>
  <button>Was ist Valplast?</button>
  <button>Wer leitet das Labor?</button>
</div>

<form id="form">
  <input type="text" id="input" placeholder="Frage stellen…" autocomplete="off" />
  <button class="send" type="submit">Senden</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const suggestions = document.getElementById('suggestions');

  function addMessage(text, sender, loading) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender + (loading ? ' loading' : '');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    suggestions.style.display = 'none';
    addMessage(text, 'user');
    input.value = '';
    const loadingEl = addMessage('Weck AI denkt nach…', 'bot', true);

    try {
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      loadingEl.classList.remove('loading');
      loadingEl.textContent = data.reply || 'Entschuldigung, ich konnte keine Antwort finden.';
    } catch (err) {
      loadingEl.classList.remove('loading');
      loadingEl.textContent = 'Es gab ein Problem bei der Verbindung. Bitte erneut versuchen.';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendMessage(input.value);
  });

  suggestions.querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => sendMessage(btn.textContent));
  });
</script>

</body>
</html>
